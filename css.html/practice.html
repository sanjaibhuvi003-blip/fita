<!DOCTYPE html>
<html lang="en">
<head>
    <title>Information </title>
    <link rel="stylesheet" href="practice.css">
</head>
<body>
    <div class="form container">
        <div class="top-design"></div>
        <div class="content">
            <div class="header">
                <h1>Information<br>Request form</h1>
                <!--Right Side-->
                <div class="h2">
                    <label>LV</label>
                        <label>LOUIE VANHOUSSEN CORPORATIONS</label>
                </div>
            </div>
        </div>
    </div><br>
    <!--Basic Information-->
    <div class="row">
        <label>Date</label>
        <input type="date">
    </div>
    <div class="field">
        <div class="form-group">
            <label>Name of<br>Requester</label>
            <input type="text">
        </div>
        <div class="form-group">
            <label>Department</label>
            <input type="text">
        </div>
        <div class="field">
            <div class="form-group">
            <label>Email<br>Address</label>
            <input type="email">
            </div>
        </div>
        <div class="form-group">
            <label>Contact<br>Number</label>
            <input type="text">
        </div>
    </div>
    <h2>Information Request</h2>

    <div class="form-row two-column">

        <div class="field">
            <label>Type of<br>Information<br>Needed</label>
            ,<input type="text">
        </div>
    </div>
    <p class="question">
        What aspect of service did you find most satisfactory ?
    </p>
    <div class="options">
        <label>
            <input type="radio" name="service">
            PDF
        </label>
        <label>
            <input type="radio" name="service">
            Word Document
        </label>
        <label>
            <input type="radio" name="service">
            Excel Spreadsheet
        </label>
        <label>
            <input type="radio" name="service">
            Other:
            <input type="text" name="Other">
        </label>

    </div>
    <label class="details-label">
        Additional Details (Please provide any specific details,keywords,or context to help process your request efficiently.)
    </label>

    <textarea></textarea>


    <h2>Authorization &amp; Approval</h2>

    <div class="form-row approval">

        <div class="field">
            <label>Approved by</label>
            <input type="text">
        </div>

        <div class="signature-box"></div>

    </div>
    
    <div class="form-row">
        <label>Date Signed</label>
        <input type="date">
    </div>

</body>
</html>
