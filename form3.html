<!DOCTYPE html>
<html lang="en">
<head>
    <title>Contact Us</title>
</head>
<body bgcolor="#ffffff">

    <h2 align="center">Contact Us</h2>

    <form action="/contact-submit"	method="post">
       <fieldset>
            <legend><b>Your Details</b></legend>

            <label	for="name">Name:</label><br>
            <input	type="text"	id="name"	name="name"	size="32"	required><br><br>

            <label	for="email">email:</label><br>
            <input	type="email" id="email"	name="email" size="32"	required><br><br>

            <label for="subject">Subject:</label><br>
            <select id="subject" name="subject">
             <option value="support">Real Estate Knowledge</option>
             <option value="registration">Registration Skill</option>
             <option value="Other" selected>Other</option> 
            </select><br><br>

            <label for="message">Message:</label><br>
            <textarea id="message" name="message" rows="5" cols="40" required></textarea><br><br>

            <input type="checkbox" id="copy" name="copy" value="yes">
            <label for="copy">Send a copy of this message</label><br><br>

            <input type="submit" value="submit">
            <input type="reset" value="reset">
        </fieldset>
    </form>
    
</body>
</html>
