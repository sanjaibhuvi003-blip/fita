<!DOCTYPE html>
<html lang="en">
<head>
    <title>Flexbox</title>

</head>
<style>
    .container {
        display: flex;
        gap: 10px;
        row-gap: 20px;
        column-gap: 30px;
        background-color: gray;
    }
    .box{
        width: 300px;
        height: 150px;
        margin: 10px;
        background-color: purple;
        color: white;
        text-align: center;
        padding-top: 30px;
        box-sizing: border-box;
    }
    .box1{
        background-color: chartreuse;
        color: black;
        font-size: 50px;
        font-style: georgia;
    }
    .box2{
        background-color: aqua;
        text-align: center;
        color: black;
        font-size: 50px;
    }
    .box3{
        background-color: chocolate;
        color: aqua;
        font-size: 50px;

    }
    .box4{
        background-color: orangered;
        color: white;
        font-size: 50px;
        font-style: italic;
    }
    .box5{
        background-color: crimson;
        color: white;
        font-size: 50px;
        font-style: italic;
    }
    .box6{
        background-color: brown;
        color: beige;
        font-size: 50px;
        font-style: oblique;
    }
</style>
<body>
    <div class="container">

    <div class="box box1">Box 1</div>
    <div class="box box2">Box 2</div>
    <div class="box box3">Box 3</div>
    <div class="box box4">Box 4</div>
    <div class="box box5">Box 5</div>
    <div class="box box6">Box 6</div>

    </div>
</body>
</html>
